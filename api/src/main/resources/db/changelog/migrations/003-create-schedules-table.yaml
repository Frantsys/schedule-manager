databaseChangeLog:
  - changeSet:
      id: 003-create-schedules-table
      author: francis
      changes:
        - createTable:
            tableName: schedules
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: professional_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: catalog_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: schedules
            baseColumnNames: customer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_schedules_customer
        - addForeignKeyConstraint:
            baseTableName: schedules
            baseColumnNames: professional_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_schedules_professional
        - addForeignKeyConstraint:
            baseTableName: schedules
            baseColumnNames: catalog_id
            referencedTableName: catalogs
            referencedColumnNames: id
            constraintName: fk_schedules_catalog
